[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-annotator"
version = "0.1.0"
description = "Auto-label images with local model inference, then correct the labels in a browser GUI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pillow>=10.0",
    "numpy>=1.24",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.16"]
ultralytics = ["ultralytics>=8.1"]
torch = ["torch>=2.0", "torchvision>=0.15"]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
auto-annotator = "auto_annotator.cli:main"

[tool.setuptools.packages.find]
include = ["auto_annotator*"]

[tool.setuptools.package-data]
auto_annotator = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
